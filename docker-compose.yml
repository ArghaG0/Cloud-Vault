# ═══════════════════════════════════════════════════════════════════════════════
# CloudVault — docker compose up
#
# Usage:
#   cp server/.env.example server/.env   # fill in real secrets
#   docker compose up --build
#
# Ports exposed on the host:
#   http://localhost:3000  →  React frontend (nginx)
#   http://localhost:5001  →  Express API    (direct, for Postman / curl)
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────────────
  # Backend — Express + Mongoose
  # ─────────────────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cloudvault-server
    restart: unless-stopped
    ports:
      - "5001:5001"          # expose directly so Postman / curl can hit the API
    env_file:
      - ./server/.env        # contains MONGODB_URI, JWT_SECRET, AWS keys, etc.
    environment:
      PORT: 5001
      NODE_ENV: production
      # Override CLIENT_URL so CORS allows the nginx-served frontend
      CLIENT_URL: http://localhost:3000
    networks:
      - cloudvault-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — Vite build → nginx static server
  # ─────────────────────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Empty string = same-origin mode: nginx proxies /api/* → server:5001,
        # so the browser never makes cross-origin requests.
        VITE_API_URL: ""
    container_name: cloudvault-client
    restart: unless-stopped
    ports:
      - "3000:80"             # visit http://localhost:3000
    depends_on:
      server:
        condition: service_healthy
    networks:
      - cloudvault-net

networks:
  cloudvault-net:
    driver: bridge
